/* a seeded random number generator, so Echo Daily is the same for everyone */
function seeded(n){return ()=>{n|=0;n=n+0x6D2B79F5|0;let t=Math.imul(n^n>>>15,1|n);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pickW=(a,rnd)=>a[Math.floor((rnd||Math.random)()*a.length)];
/* how long Echo airlines take between two airports, either way (median of the timetable's block times) */
function pairDur(a,b){const L=[];for(const r of ROT){if((r.A===a&&r.B===b)||(r.A===b&&r.B===a))L.push(r.A===a?r.dur:(r.idur||r.dur));
  if(r.C&&((r.B===a&&r.C===b)||(r.B===b&&r.C===a)))L.push(r.B===a?r.cdur:(r.cidur||r.cdur));}return L.length?median(L):null;}
let PAIRS1=null;   // airport pairs between busy airports, for the route games
function busyPairs(){if(PAIRS1)return PAIRS1;const top=new Set(apBusy().slice(0,600).map(x=>x[0]));
  PAIRS1=[...pairIndex()].filter(([k])=>{const [x,y]=k.split("|");return top.has(x)&&top.has(y);});return PAIRS1;}

/* a round of four buttons, one or more right; calls done(ok) after the answer is shown */
function fourWay(box,opts,done,explain){
  box.innerHTML=`<div class="qopts">${opts.map((o,i)=>`<button type="button" class="btn qo" data-i="${i}">${o.html}</button>`).join("")}</div><div id="qr"></div>`;
  box.querySelectorAll(".qo").forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i],ok=!!o.ok;
    box.querySelectorAll(".qo").forEach(x=>{x.disabled=true;if(opts[+x.dataset.i].ok)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
    done(ok,explain(ok,o));});}
function endScreen(out,key,score,of,again,lines){best.set(key,score);
  out.innerHTML=`<div class="stats">${stat("You got",`${score} of ${of}`,lines[score>=of*0.9?0:score>=of*0.6?1:2],true)}${stat("Best",`${best.get(key)} of ${of}`,"")}</div><button type="button" class="btn prim" id="nx">Play again</button>`;
  $("nx").onclick=again;}

/* question makers, shared by the games and Echo Daily. Each gives {top, opts, explain} */
function qWho(rnd){const P=busyPairs().filter(([,m])=>m.size<=3),[k,m]=pickW(P,rnd),[a,b]=k.split("|"),flies=new Set(m.keys());
  const near=gamePool().filter(i=>!flies.has(i)&&ROT.some(r=>r.ai===i&&(r.A===a||r.A===b))),others=gamePool().filter(i=>!flies.has(i));
  const ans=[...m].sort((p,q)=>q[1]-p[1])[0][0],opts=new Set([ans]);let t=0;
  while(opts.size<4&&t++<300)opts.add(pickW((rnd||Math.random)()<0.7&&near.length>3?near:others,rnd));
  const O=[...opts].sort((p,q)=>((rnd||Math.random)()-0.5));
  return {top:`<p class="pair"><b>${a}</b> ${esc(cityOf(a))}<span class="sub">${esc(country(AP[a].cc))}</span></p><p class="pairto">${dist(km(a,b))}</p><p class="pair"><b>${b}</b> ${esc(cityOf(b))}<span class="sub">${esc(country(AP[b].cc))}</span></p><p class="qask">Who flies it?</p>`,
    opts:O.map(i=>({html:`${esc(AL[i].name)}<span class="sub">${esc(divShort(i))}</span>`,ok:flies.has(i)})),
    explain:ok=>`${ok?"Right.":"Not quite."} ${[...m].sort((p,q)=>q[1]-p[1]).map(([i,n])=>`${esc(AL[i].name)} (${fmtN(n)} a week)`).join(", ")} ${m.size>1?"fly":"flies"} ${a}–${b}.`};}
function qTail(rnd){const pool=quizPool(),ans=pickW(pool,rnd),dv=divOf(ans),near=pool.filter(i=>i!==ans&&divOf(i)===dv),opts=new Set([ans]);
  while(opts.size<4)opts.add(pickW((rnd||Math.random)()<0.7&&near.length>=3?near:pool,rnd));
  return {top:`<div class="qtail small">${tailSVG(ans,"qsvg")}</div><p class="qask">Whose tail is this?</p>`,opts:[...opts].sort(()=>((rnd||Math.random)()-0.5)).map(i=>({html:esc(AL[i].name),ok:i===ans})),
    explain:ok=>`${ok?"Got it.":"Not quite."} It's ${esc(AL[ans].name)}, ${esc(dv.name)}.`};}
function qCode(rnd){const pool=apBusy().slice(0,150).map(x=>x[0]),ans=pickW(pool,rnd),opts=[ans],cs=new Set([cityOf(ans)]);
  while(opts.length<4){const c=pickW(pool,rnd);if(!cs.has(cityOf(c))){cs.add(cityOf(c));opts.push(c);}}
  return {top:`<p class="bigcode">${ans}</p><p class="qask">Which city?</p>`,opts:opts.sort(()=>((rnd||Math.random)()-0.5)).map(c=>({html:`${esc(cityOf(c))}<span class="sub">${esc(country(AP[c].cc))}</span>`,ok:c===ans})),
    explain:ok=>`${ok?"Right.":"Not quite."} ${ans} is ${esc(AP[ans].name)}.`};}
function qReal(rnd){const P=pairIndex(),pool=apBusy().slice(0,600).map(x=>x[0]);let a,b;const real=(rnd||Math.random)()<0.5;
  if(real){[a,b]=pickW(busyPairs(),rnd)[0].split("|");}else{let t=0;do{a=pickW(pool,rnd);b=pickW(pool,rnd);t++;}while((a===b||P.has(pairKey(a,b))||km(a,b)<400||km(a,b)>12000||!legalPair(a,b))&&t<500);}
  const m=P.get(pairKey(a,b));
  return {top:`<p class="pair"><b>${a}</b> ${esc(cityOf(a))}</p><p class="pairto">${dist(km(a,b))}</p><p class="pair"><b>${b}</b> ${esc(cityOf(b))}</p><p class="qask">Does any Echo airline fly it nonstop?</p>`,
    opts:[{html:"Echo flies it",ok:real},{html:"Nobody does",ok:!real}],explain:ok=>`${ok?"Right.":"Not quite."} ${m?`${m.size} Echo airline${m.size>1?"s fly":" flies"} it.`:"No Echo airline flies it nonstop."}`};}
function qHL(rnd){const pool=gamePool(),st=pickW(HL_STATS,rnd);let a,b,t=0;do{a=pickW(pool,rnd);b=pickW(pool,rnd);t++;}while((a===b||st[2](a)===st[2](b))&&t<200);
  return {top:`<p class="qask">Which has more ${st[1]}?</p>`,opts:[a,b].map(i=>({html:`${esc(AL[i].name)}<span class="sub">${esc(divShort(i))}</span>`,ok:st[2](i)>st[2](i===a?b:a)})),
    explain:ok=>`${ok?"Right.":"Not quite."} ${esc(AL[a].name)}: ${st[3](st[2](a))}, ${esc(AL[b].name)}: ${st[3](st[2](b))}.`};}

  const ans=pickR(apBusy().slice(0,300).map(x=>x[0])),W=960,H=500,proj=d3.geoEqualEarth().fitExtent([[6,6],[W-6,H-6]],{type:"Sphere"}),path=d3.geoPath(proj);PN.n++;

    if(!ll||!isFinite(ll[0])||!isFinite(ll[1])||Math.abs(ll[0])>180||Math.abs(ll[1])>90)return;done=true;

/* ---------- Echo Elysium: the realism division's toolkit ---------- */

  ["slots","Slot finder","Echo departures in every five-minute slot at an airport, so you can pick an empty one."],

/* airline box that can be left empty for "all of Elysium" */
const elyAl=(q)=>alIn("al","Airline <small>empty = all of Elysium</small>",alVal(q));
function elyPick(out,pick,again){const v=$("al").value.trim();if(!v&&pick==null)return {all:true,list:AL.map((a,i)=>i).filter(isEly)};
  const me=alResolve(out,$("al"),pick,again);if(me==null)return null;$("al").value=AL[me].name;return {all:false,me,list:[me]};}
const wdOf=(c,t)=>mod(localDay(c,t)+3,7),lmin=(c,t)=>mod(localMin(c,t),1440);
const inWin=(m,[a,b])=>a<=b?m>=a&&m<b:m>=a||m<b;
const hm=s=>{const [h,m]=s.split(":").map(Number);return h*60+m;};

/* ---- 1. curfews (approximate: the well-known ones) ---- */
const CURFEW={FRA:["23:00","05:00","curfew"],MUC:["00:00","05:00","curfew"],BER:["00:00","05:00","curfew"],HAM:["23:00","06:00","curfew"],DUS:["23:00","06:00","curfew"],STR:["23:30","06:00","curfew"],
  ZRH:["23:30","06:00","curfew"],GVA:["00:00","06:00","curfew"],ORY:["23:30","06:00","curfew"],LCY:["22:30","06:30","curfew"],LIN:["23:00","06:00","curfew"],
  LHR:["23:30","06:00","night quota"],LGW:["23:30","06:00","night quota"],STN:["23:30","06:00","night quota"],AMS:["23:00","07:00","night limits"],BRU:["23:00","06:00","night limits"],
  SYD:["23:00","06:00","curfew"],ADL:["23:00","06:00","curfew"],WLG:["00:00","06:00","curfew"],NRT:["00:00","06:00","curfew"],ITM:["21:00","07:00","curfew"],FUK:["22:00","07:00","curfew"],
  GMP:["23:00","06:00","curfew"],CGH:["23:00","06:00","curfew"],SDU:["23:00","06:00","curfew"],YTZ:["23:00","06:45","curfew"],YYZ:["00:30","06:30","night limits"],
  SNA:["22:00","07:00","curfew"],BUR:["22:00","07:00","night limits"],LGB:["22:00","07:00","curfew"],SAN:["23:30","06:30","curfew"],DCA:["22:00","07:00","night limits"]};
function viewCurfew(){const q=Q();$("main").innerHTML=head("Curfew","check","Flights leaving or landing inside the night curfews and restrictions at airports that have them.")+
  `<form class="f" id="f">${elyAl(q)}<button class="btn prim">Check</button></form><div class="out" id="out"></div>`;
  alList();$("f").onsubmit=e=>{e.preventDefault();runCurfew();};runCurfew(q.get("al")!=null?+q.get("al"):undefined);}
function runCurfew(pick){const out=$("out");
  const P=elyPick(out,pick,i=>runCurfew(i));if(!P)return;setQ("curfew",P.all?{}:{al:P.me});
  const S=new Set(P.list),hits=[];
  for(const r of ROT){if(!S.has(r.ai))continue;for(const l of weekLegs(r)){
    const cd=CURFEW[l.from],ca=CURFEW[l.to],dm=lmin(l.from,l.t),am=lmin(l.to,l.t+l.dur);
    if(cd&&inWin(dm,[hm(cd[0]),hm(cd[1])]))hits.push({l,ai:r.ai,at:l.from,kind:"leaves",m:dm,c:cd,ac:r.ac});
    if(ca&&inWin(am,[hm(ca[0]),hm(ca[1])]))hits.push({l,ai:r.ai,at:l.to,kind:"lands",m:am,c:ca,ac:r.ac});}}

  ${stat("Airports",fmtN(byAp.size),"with night flights")}${stat("Checked",P.all?"Elysium":esc(AL[P.me].name),P.all?`${fmtN(P.list.length)} airlines`:"")}</div>
  ${hits.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Flight</th>${P.all?"<th>Airline</th>":""}<th>At</th><th class="r">Local time</th><th>Rule there</th><th>Days</th></tr></thead><tbody>
  ${hits.slice(0,80).map(h=>`<tr><td><b>${esc(fnOf(h.ai,h.l.fn))}</b> ${h.l.from}–${h.l.to}</td>${P.all?`<td>${esc(AL[h.ai].name)}</td>`:""}<td>${h.kind} ${esc(apName(h.at))}</td><td class="r">${hhmm(h.m)}</td><td class="${h.c[2]==="curfew"?"bad":""}">${h.c[2]==="curfew"?"Curfew":"Night limits"} ${h.c[0]}–${h.c[1]}</td><td>${daysTxt(h.l.days)}</td></tr>`).join("")}</tbody></table></div>${hits.length>80?`<p class="note">The first 80 of ${fmtN(hits.length)}.</p>`:""}`:`<p class="note">No flights at night at any airport on the list. Nicely done.</p>`}
  <p class="note">Hours are local and approximate, for ${fmtN(Object.keys(CURFEW).length)} well-known airports: ${Object.keys(CURFEW).join(", ")}. "Curfew" means the airport bans normal night flights; "night limits" (Heathrow's night quota, say) means a few are allowed. Real rules have exceptions for delays and some aircraft.</p>`;}

/* ---- 2. passenger-friendly times ---- */
function viewHours(){const q=Q();$("main").innerHTML=head("Passenger-friendly","times","Flights leaving or landing between 1 and 5 in the morning local time, and long-hauls landing at awkward hours, with a departure time that would land at breakfast instead.")+
  `<form class="f" id="f">${alIn("al","Airline",alVal(q))}<button class="btn prim">Check</button></form><div class="out" id="out"></div>`;
  alList();$("f").onsubmit=e=>{e.preventDefault();runHours();};if(q.get("al")!=null||q.get("q"))runHours(q.get("al")!=null?+q.get("al"):undefined);}
function runHours(pick){const out=$("out"),me=alResolve(out,$("al"),pick,i=>runHours(i));if(me==null)return;$("al").value=AL[me].name;setQ("hours",{al:me});
  const L=[];for(const r of ROT){if(r.ai!==me)continue;for(const l of weekLegs(r))L.push(l);}if(!L.length)return noRoutes(out,me);
  const bad=[];let ok=0;
  for(const l of L){const dm=lmin(l.from,l.t),am=lmin(l.to,l.t+l.dur),dB=dm>=60&&dm<300,aB=am>=60&&am<300;
    if(!dB&&!aB){ok++;continue;}
    /* a time that lands 07:00 local (long-haul) or leaves 07:00 (short), keeping the same block time */
    let sug=null;if(aB){const shift=(7*60-am+1440)%1440;sug=mod(dm+shift,1440);if(sug>=60&&sug<300)sug=null;}else{sug=7*60;}
    bad.push({l,dm,am,dB,aB,sug});}
  bad.sort((p,q)=>q.l.dur-p.l.dur);const pct=Math.round(ok/L.length*100);
  out.innerHTML=`<div class="stats">${stat("Friendly",pct+"%","of your flights leave and land between 5 AM and 1 AM",true)}${stat("Small hours",fmtN(bad.length),"flights at 1 to 5 AM")}
  ${stat("Landing then",fmtN(bad.filter(b=>b.aB).length),"arrive 1 to 5 AM")}${stat("Leaving then",fmtN(bad.filter(b=>b.dB).length),"depart 1 to 5 AM")}</div>
  ${bad.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Flight</th><th class="r">Leaves</th><th class="r">Lands</th><th class="r">Block</th><th>Better</th><th>Days</th></tr></thead><tbody>
  ${bad.slice(0,60).map(b=>`<tr><td><b>${esc(fnOf(me,b.l.fn))}</b> ${b.l.from}–${b.l.to}</td><td class="r ${b.dB?"bad":""}">${hhmm(b.dm)}</td><td class="r ${b.aB?"bad":""}">${hhmm(b.am)}</td><td class="r">${dur(b.l.dur)}</td><td>${b.sug!=null?`leave ${hhmm(b.sug)} → lands ${hhmm(b.sug+(b.am-b.dm+1440)%1440)}`:"—"}</td><td>${daysTxt(b.l.days)}</td></tr>`).join("")}</tbody></table></div>${bad.length>60?`<p class="note">The 60 longest of ${fmtN(bad.length)}.</p>`:""}`:`<p class="note">Every flight leaves and lands at a time passengers would book.</p>`}
  <p class="note">Times are local at each airport. Real airlines do fly some red-eyes and early bank departures; this just shows where yours are. A new time also moves the rest of that plane's day, so check it in the Rotation planner.</p>`;}

/* ---- 3. registrations ---- */
const REGP={US:["N"],GB:["G"],DE:["D"],FR:["F"],IT:["I"],ES:["EC"],PT:["CS","CR"],NL:["PH"],BE:["OO"],CH:["HB"],AT:["OE"],IE:["EI","EJ"],DK:["OY"],NO:["LN"],SE:["SE"],FI:["OH"],IS:["TF"],PL:["SP"],CZ:["OK"],SK:["OM"],HU:["HA"],RO:["YR"],BG:["LZ"],GR:["SX"],TR:["TC"],RU:["RA","RF"],UA:["UR"],BY:["EW"],KZ:["UP"],UZ:["UK"],AZ:["4K"],GE:["4L"],AM:["EK"],IL:["4X"],AE:["A6"],QA:["A7"],BH:["A9C"],OM:["A4O"],SA:["HZ"],KW:["9K"],JO:["JY"],LB:["OD"],EG:["SU"],MA:["CN"],DZ:["7T"],TN:["TS"],LY:["5A"],ET:["ET"],KE:["5Y"],TZ:["5H"],UG:["5X"],RW:["9XR"],NG:["5N"],GH:["9G"],SN:["6V"],CI:["TU"],ZA:["ZS","ZT","ZU"],ZW:["Z"],ZM:["9J"],AO:["D2"],MZ:["C9"],MG:["5R"],MU:["3B"],SC:["S7"],IN:["VT"],PK:["AP"],BD:["S2"],LK:["4R"],NP:["9N"],MV:["8Q"],AF:["YA"],IR:["EP"],IQ:["YI"],CN:["B"],HK:["B"],MO:["B"],TW:["B"],JP:["JA"],KR:["HL"],KP:["P"],MN:["JU"],VN:["VN"],TH:["HS"],MY:["9M"],SG:["9V"],ID:["PK"],PH:["RP"],KH:["XU"],LA:["RDPL"],MM:["XY","XZ"],BN:["V8"],AU:["VH"],NZ:["ZK","ZL","ZM"],FJ:["DQ"],PG:["P2"],CA:["C","CF","CG"],MX:["XA","XB","XC"],GT:["TG"],CR:["TI"],PA:["HP"],CU:["CU"],DO:["HI"],JM:["6Y"],BS:["C6"],CO:["HK"],VE:["YV"],EC:["HC"],PE:["OB"],BO:["CP"],CL:["CC"],AR:["LV","LQ"],UY:["CX"],PY:["ZP"],BR:["PP","PR","PS","PT","PU"],LU:["LX"],MT:["9H"],CY:["5B"],HR:["9A"],SI:["S5"],RS:["YU"],BA:["E7"],ME:["4O"],MK:["Z3"],AL:["ZA"],EE:["ES"],LV:["YL"],LT:["LY"],MD:["ER"],KG:["EX"],TJ:["EY"],TM:["EZ"],SY:["YK"],YE:["7O"],SD:["ST"],CM:["TJ"],BW:["A2"],NA:["V5"],MW:["7Q"],SZ:["3DC"],CV:["D4"],GN:["3X"],ML:["TZ"],NE:["5U"],BF:["XT"],TD:["TT"],CF:["TL"],CG:["TN"],CD:["9S"],GA:["TR"],GQ:["3C"],BJ:["TY"],TG:["5V"],LR:["A8"],SL:["9L"],GM:["C5"],MR:["5T"],SO:["6O"],DJ:["J2"],ER:["E3"],SS:["Z8"],BT:["A5"],TL:["4W"],BB:["8P"],TT:["9Y"],HT:["HH"],HN:["HR"],NI:["YN"],SV:["YS"],BZ:["V3"],GY:["8R"],SR:["PZ"],AW:["P4"],CW:["PJ"],KY:["VP-C"],BM:["VP-B","VQ-B"],VG:["VP-L"],IM:["M"],GG:["2"],JE:["ZJ"]};
function regPrefix(reg){reg=String(reg||"").toUpperCase().trim();if(!reg)return null;
  const h=reg.indexOf("-");if(h>0)return reg.slice(0,h);const m=reg.match(/^(N|JA|HL|UR|RA|B)(?=[0-9A-Z])/);return m?m[1]:null;}
function regFits(reg,cc){const P=REGP[cc];if(!P)return null;const R=String(reg||"").toUpperCase();
  return P.some(p=>p==="N"?/^N[1-9]/.test(R):p==="JA"?/^JA[0-9]/.test(R):p==="HL"?/^HL[0-9]/.test(R):p==="B"?/^B-?[0-9A-Z]/.test(R)&&!/^B[A-Z]{2}-/.test(R):R.startsWith(p+"-")||(p.includes("-")&&R.startsWith(p)));}
function regCountry(reg){const R=String(reg||"").toUpperCase();let best=null,len=0;
  for(const [cc,P] of Object.entries(REGP))for(const p of P){const ok=p==="N"?/^N[1-9]/.test(R):p==="JA"?/^JA[0-9]/.test(R):p==="HL"?/^HL[0-9]/.test(R):R.startsWith(p+"-")||(p.includes("-")&&R.startsWith(p));if(ok&&p.length>len){best=cc;len=p.length;}}return best;}
function viewRegs(){const q=Q();$("main").innerHTML=head("Registration","check","Each plane's registration against your airline's country. Real airlines register their planes at home, with that country's letters at the front.")+
  `<form class="f" id="f">${alIn("al","Airline",alVal(q))}<button class="btn prim">Check</button></form><div class="out" id="out"></div>`;
  alList();$("f").onsubmit=e=>{e.preventDefault();runRegs();};if(q.get("al")!=null||q.get("q"))runRegs(q.get("al")!=null?+q.get("al"):undefined);}
function runRegs(pick){const out=$("out"),me=alResolve(out,$("al"),pick,i=>runRegs(i));if(me==null)return;$("al").value=AL[me].name;setQ("regs",{al:me});
  const cc=AL[me].country,acs=[...new Set(ROT.filter(r=>r.ai===me&&r.ac>=0&&ACL[r.ac]).map(r=>r.ac))];
  if(!acs.length){out.innerHTML=`<p class="note">${esc(AL[me].name)} has no registered aircraft in the timetable.</p>`;return;}
  if(!REGP[cc]){out.innerHTML=`<p class="note">AirTools doesn't know the registration letters for ${esc(country(cc)||"this airline's country")} yet.</p>`;return;}
  const bad=acs.filter(ac=>!regFits(ACL[ac][1],cc)).map(ac=>({ac,reg:ACL[ac][1],from:regCountry(ACL[ac][1])}));
  const by=new Map();bad.forEach(b=>by.set(b.from||"?",(by.get(b.from||"?")||0)+1));
  out.innerHTML=`<div class="stats">${stat("Registered at home",Math.round((acs.length-bad.length)/acs.length*100)+"%",`${fmtN(acs.length-bad.length)} of ${fmtN(acs.length)} planes`,true)}${stat("Home letters",esc(REGP[cc].join(" / ")),esc(country(cc)))}
  ${stat("Elsewhere",fmtN(bad.length),"planes")}${stat("Most common",by.size?esc([...by].sort((p,q)=>q[1]-p[1])[0][0]==="?"?"unknown":country([...by].sort((p,q)=>q[1]-p[1])[0][0])):"—","for the others")}</div>
  ${bad.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Registration</th><th>Aircraft</th><th>Looks like</th></tr></thead><tbody>${bad.slice(0,80).map(b=>`<tr><td class="mono">${esc(b.reg)}</td><td>${esc(acModel(b.ac))}</td><td>${b.from?esc(country(b.from)):"no country's letters"}</td></tr>`).join("")}</tbody></table></div>${bad.length>80?`<p class="note">The first 80 of ${fmtN(bad.length)}.</p>`:""}`:`<p class="note">Every plane carries ${esc(country(cc))}'s letters.</p>`}
  <p class="note">Leased planes and airlines with foreign subsidiaries do sometimes fly other countries' registrations in real life. Hong Kong, Macau, Taiwan and mainland China all use B-.</p>`;}

/* ---- 4. flight numbers ---- */
function viewFltNo(){const q=Q();$("main").innerHTML=head("Flight number","check","How your flight numbers follow real airline habits: odd numbers out and the next even number back, one number per route, low numbers for long-haul flagships.")+
  `<form class="f" id="f">${alIn("al","Airline",alVal(q))}<button class="btn prim">Check</button></form><div class="out" id="out"></div>`;
  alList();$("f").onsubmit=e=>{e.preventDefault();runFltNo();};if(q.get("al")!=null||q.get("q"))runFltNo(q.get("al")!=null?+q.get("al"):undefined);}
function runFltNo(pick){const out=$("out"),me=alResolve(out,$("al"),pick,i=>runFltNo(i));if(me==null)return;$("al").value=AL[me].name;setQ("fltno",{al:me});
  const rows=ROT.filter(r=>r.ai===me);if(!rows.length)return noRoutes(out,me);
  const use=new Map(),add=(n,a,b,dur)=>{if(n==null)return;const k=String(n);let x=use.get(k);if(!x){x={n,legs:new Set(),dur};use.set(k,x);}x.legs.add(a+"–"+b);};
  const pairBad=[],long4=[];
  for(const r of rows){const ifn=r.ifn!=null?r.ifn:r.fn+1;add(r.fn,r.A,r.B,r.dur);add(ifn,r.B,r.A,r.idur||r.dur);
    if(r.C){const ci=r.cifn!=null?r.cifn:r.cfn+1;add(r.cfn,r.B,r.C,r.cdur);add(ci,r.C,r.B,r.cidur||r.cdur);}
    const fine=(r.fn%2===1&&ifn===r.fn+1)||(r.fn%2===0&&ifn===r.fn-1)||(r.fn%2===0&&ifn===r.fn+1);
    if(!fine)pairBad.push({r,ifn});if(r.dur>=360&&r.fn>=1000)long4.push(r);}
  const dup=[...use.values()].filter(x=>x.legs.size>2||(x.legs.size===2&&(()=>{const [p,q]=[...x.legs];return p.split("–").reverse().join("–")!==q;})()));
  const score=Math.round((rows.length-pairBad.length)/rows.length*100);
  out.innerHTML=`<div class="stats">${stat("Odd out, even back",score+"%",`${fmtN(rows.length-pairBad.length)} of ${fmtN(rows.length)} routes`,true)}${stat("Used twice",fmtN(dup.length),"numbers on more than one route")}
  ${stat("Long-haul, 4 digits",fmtN(long4.length),"flights over 6 hours numbered 1000+")}${stat("Numbers in use",fmtN(use.size),"")}</div>
  ${dup.length?`<h4>Numbers on more than one route</h4><div class="scroll"><table class="tbl"><thead><tr><th>Flight</th><th>Routes</th></tr></thead><tbody>${dup.slice(0,40).map(x=>`<tr><td><b>${esc(fnOf(me,x.n))}</b></td><td>${[...x.legs].join(", ")}</td></tr>`).join("")}</tbody></table></div>`:""}
  ${pairBad.length?`<h4>Return numbers off the habit</h4><div class="scroll"><table class="tbl"><thead><tr><th>Route</th><th>Out</th><th>Back</th><th>Usual</th></tr></thead><tbody>${pairBad.slice(0,40).map(x=>`<tr><td>${x.r.A}–${x.r.B}</td><td>${esc(fnOf(me,x.r.fn))}</td><td class="bad">${esc(fnOf(me,x.ifn))}</td><td>${esc(fnOf(me,x.r.fn%2?x.r.fn:x.r.fn-1))} / ${esc(fnOf(me,x.r.fn%2?x.r.fn+1:x.r.fn))}</td></tr>`).join("")}</tbody></table></div>${pairBad.length>40?`<p class="note">The first 40 of ${fmtN(pairBad.length)}.</p>`:""}`:""}
  ${long4.length?`<h4>Long-hauls on four-digit numbers</h4><div class="chips">${long4.slice(0,30).map(r=>`<span class="chip">${esc(fnOf(me,r.fn))} ${r.A}–${r.B} · ${dur(r.dur)}</span>`).join("")}</div>`:""}
  <p class="note">These are habits, not rules: plenty of real airlines break them. Four-digit numbers usually mean regional or codeshare flights; flagships get one to three digits.</p>`;}

/* ---- 5. turnarounds ---- */
function minTurn(model){const m=String(model||"").toUpperCase();
  if(/A380|747/.test(m))return 90;if(/777|787|A350|A340|A330|767|MD-11|IL-96|A300|A310|DC-10|L-1011/.test(m))return 60;
  if(/757|A321/.test(m))return 45;if(/ATR|DASH|Q400|DHC|SAAB|DORNIER|BEECH|JETSTREAM|TWIN OTTER|CESSNA|EMB-1|TURBO/.test(m))return 20;
  if(/CRJ|E1[79]0|E19|E2|EMBRAER|ERJ|SUPERJET|SSJ|ARJ|C919|BAE|AVRO|FOKKER|A220|CS[13]00/.test(m))return 30;return 35;}
function viewTurns(){const q=Q();$("main").innerHTML=head("Turnaround","check","Every plane's week across all its routes: turns shorter than its type needs on the ground, and planes that aren't at the airport their next flight leaves from.")+
  `<form class="f" id="f">${alIn("al","Airline",alVal(q))}<button class="btn prim">Check</button></form><div class="out" id="out"></div>`;
  alList();$("f").onsubmit=e=>{e.preventDefault();runTurns();};if(q.get("al")!=null||q.get("q"))runTurns(q.get("al")!=null?+q.get("al"):undefined);}
function runTurns(pick){const out=$("out"),me=alResolve(out,$("al"),pick,i=>runTurns(i));if(me==null)return;$("al").value=AL[me].name;setQ("turns",{al:me});
  const by=new Map(),d0=Math.floor(nowMin()/1440);
  for(const r of ROT){if(r.ai!==me||r.ac<0)continue;for(let d=d0-1;d<d0+8;d++){if(!runsOn(r,d))continue;for(const l of legsOf(r,d)){let a=by.get(r.ac);if(!a){a=[];by.set(r.ac,a);}a.push(l);}}}
  if(!by.size){out.innerHTML=`<p class="note">${esc(AL[me].name)} has no planes with routes in the timetable.</p>`;return;}
  const short=[],tele=[],overl=[];
  for(const [ac,L] of by){L.sort((p,q)=>p.t-q.t);const need=minTurn(acModel(ac)),seen=new Set();
    for(let i=1;i<L.length;i++){const p=L[i-1],n=L[i];if(p.r===n.r||p.t+p.dur<d0*1440||n.t>=(d0+7)*1440)continue;   /* inside one route the game sets the times */const gap=n.t-(p.t+p.dur),k=p.fn+"|"+n.fn;if(seen.has(k))continue;seen.add(k);
      if(gap<0)overl.push({ac,p,n,gap});else if(p.to!==n.from)tele.push({ac,p,n,gap});else if(gap<need)short.push({ac,p,n,gap,need});}}
  const planes=by.size,okPl=[...by.keys()].filter(ac=>![...short,...tele,...overl].some(x=>x.ac===ac)).length;
  const row=(x,why)=>`<tr><td class="mono">${esc(acReg(x.ac))}<span class="sub">${esc(acModel(x.ac))}</span></td><td>${esc(fnOf(me,x.p.fn))} ${x.p.from}–${x.p.to}, lands ${localTime(x.p.to,x.p.t+x.p.dur)}</td><td>${esc(fnOf(me,x.n.fn))} ${x.n.from}–${x.n.to}, leaves ${localTime(x.n.from,x.n.t)}</td><td class="bad">${why}</td></tr>`;
  const tbl=(t,L,why)=>L.length?`<h4>${t}</h4><div class="scroll"><table class="tbl"><thead><tr><th>Plane</th><th>Lands from</th><th>Next flight</th><th>Problem</th></tr></thead><tbody>${L.slice(0,40).map(x=>row(x,why(x))).join("")}</tbody></table></div>${L.length>40?`<p class="note">The first 40 of ${fmtN(L.length)}.</p>`:""}`:"";
  out.innerHTML=`<div class="stats">${stat("Clean planes",fmtN(okPl),`of ${fmtN(planes)}`,true)}${stat("Double-booked",fmtN(overl.length),"next flight leaves before it lands")}
  ${stat("In the wrong place",fmtN(tele.length),"next flight leaves from elsewhere")}${stat("Short turns",fmtN(short.length),"less ground time than the type needs")}</div>
  ${tbl("Double-booked",overl,x=>`overlaps by ${dur(-x.gap)}`)}${tbl("In the wrong place",tele,x=>`plane is at ${x.p.to}, flight leaves ${x.n.from}`)}${tbl("Short turns",short,x=>`${dur(x.gap)} on the ground, ${esc(acModel(x.ac))} needs about ${dur(x.need)}`)}
  ${!overl.length&&!tele.length&&!short.length?`<p class="note">Every plane's week joins up, with enough time on the ground.</p>`:""}
  <p class="note">This week's flights, plane by plane, across all its routes. Minimum turns are rough real-world figures: about 20 minutes for turboprops, 30 for regional jets, 35 for A320s and 737s, 45 for 757s and A321s, an hour for widebodies and 90 for the 747 and A380. Only the joins between different routes are checked: inside one route the game sets the times itself.</p>`;}

/* ---- 6. runway crowding ---- */
function viewRunway(){const q=Q(),wd=q.get("d")!=null?q.get("d"):String(todayWd());
  $("main").innerHTML=head("Runway","crowding","Minutes when two or more Elysium flights leave the same airport. A real runway takes one departure every minute or two.")+
  `<form class="f" id="f">${apIn("a","Airport <small>empty = all</small>",q.get("ap"))}<label>Day<select id="dy">${DAYN.map((d,i)=>`<option value="${i}"${String(i)===wd?" selected":""}>${d}</option>`).join("")}</select></label><button class="btn prim">Check</button></form><div class="out" id="out"></div>`;
  apList();$("f").onsubmit=e=>{e.preventDefault();runRunway();};runRunway();}
function runRunway(){const out=$("out"),typed=$("a").value.trim(),a=typed?apPick(typed):null,wd=+$("dy").value;
  if(typed&&!a){out.innerHTML=`<p class="err">That isn't an airport any Echo airline flies to.</p>`;return;}if(a)$("a").value=a;setQ("runway",{ap:a||"",d:wd});
  const M=new Map();
  for(const r of ROT){if(!isEly(r.ai))continue;for(const l of weekLegs(r)){if(a&&l.from!==a)continue;if(!l.days.has(wd))continue;
    const k=l.from+"|"+lmin(l.from,l.t);let x=M.get(k);if(!x){x=[];M.set(k,x);}x.push({ai:r.ai,l});}}
  const clash=[...M].filter(([,x])=>x.length>=2).map(([k,x])=>{const [c,m]=k.split("|");return {c,m:+m,x};});
  if(!a){const by=new Map();clash.forEach(z=>{const v=by.get(z.c)||{n:0,f:0};v.n++;v.f+=z.x.length;by.set(z.c,v);});const top=[...by].sort((p,q)=>q[1].n-p[1].n).slice(0,25);
    out.innerHTML=`<div class="stats">${stat("Crowded minutes",fmtN(clash.length),`across Elysium on ${DAYN[wd]}`,true)}${stat("Airports",fmtN(by.size),"with at least one")}${stat("Worst",top.length?top[0][0]:"—",top.length?`${fmtN(top[0][1].n)} crowded minutes`:"")}</div>
    ${top.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Airport</th><th class="r">Crowded minutes</th><th class="r">Flights in them</th><th></th></tr></thead><tbody>${top.map(([c,v])=>`<tr><td><b>${c}</b> ${esc(AP[c].city)}</td><td class="r">${fmtN(v.n)}</td><td class="r">${fmtN(v.f)}</td><td><a class="btn sm" href="#/runway?ap=${c}&d=${wd}">See them</a></td></tr>`).join("")}</tbody></table></div>`:`<p class="note">No two Elysium flights leave any airport in the same minute on ${DAYN[wd]}.</p>`}
    <p class="note">Departures only, Elysium airlines only, local time. Big airports have several runways, so two at once there is less of a problem than at a one-runway airport.</p>`;return;}
  clash.sort((p,q)=>p.m-q.m);
  out.innerHTML=`<div class="stats">${stat("Crowded minutes",fmtN(clash.length),`at ${esc(apName(a))} on ${DAYN[wd]}`,true)}${stat("Flights in them",fmtN(clash.reduce((s,z)=>s+z.x.length,0)),"")}</div>
  ${clash.length?`<div class="scroll"><table class="tbl"><thead><tr><th class="r">Time</th><th>Leaving together</th><th>Nearest free slot</th></tr></thead><tbody>${clash.map(z=>{let f=null;for(let d=5;d<=60&&f==null;d+=5){for(const s of [z.m+d,z.m-d]){const mm=mod(s,1440);if(!M.has(a+"|"+mm)){f=mm;break;}}}
    return `<tr><td class="r"><b>${hhmm(z.m)}</b></td><td>${z.x.map(y=>`${esc(fnOf(y.ai,y.l.fn))} to ${y.l.to} <span class="sub" style="display:inline">${esc(AL[y.ai].name)}</span>`).join("<br>")}</td><td>${f!=null?hhmm(f):"—"}</td></tr>`;}).join("")}</tbody></table></div>`:`<p class="note">No two Elysium flights leave ${a} in the same minute on ${DAYN[wd]}.</p>`}
  <p class="note">Elysium departures, local time. Game times go in five-minute steps, so the free slot is the nearest five-minute mark with no Elysium departure; the Slot finder shows all of Echo.</p>`;}

async function runMovers(){const out=$("out");let C;try{C=await changes();}catch(e){out.innerHTML=`<p class="err">The list of changes isn't on Echo Live yet, so this can't show anything right now.</p>`;return;}
  if(!$("out"))return;const M=new Map(),g=i=>{let x=M.get(i);if(!x){x={i,ra:0,rr:0,fa:0,fr:0};M.set(i,x);}return x;};
  C.add.forEach(([i,,,n])=>{if(!AL[i])return;const x=g(i);x.ra++;x.fa+=n;});C.rem.forEach(([i,,,n])=>{if(!AL[i])return;const x=g(i);x.rr++;x.fr+=n;});
  const L=[...M.values()].map(x=>Object.assign(x,{net:x.fa-x.fr,nr:x.ra-x.rr})),up=[...L].sort((p,q)=>q.net-p.net).filter(x=>x.net>0).slice(0,15),dn=[...L].sort((p,q)=>p.net-q.net).filter(x=>x.net<0).slice(0,15);
  const R=rankData(),newb=C.joined.filter(i=>AL[i]&&R[i]).sort((p,q)=>R[q].flights-R[p].flights).slice(0,10);
  const dv=new Map();L.forEach(x=>{const d=divOf(x.i).name;const v=dv.get(d)||{ra:0,rr:0,net:0};v.ra+=x.ra;v.rr+=x.rr;v.net+=x.net;dv.set(d,v);});
  const f=s=>new Date(s+"T12:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"long"}),sg=n=>(n>0?"+":n<0?"−":"")+fmtN(Math.abs(n));
  const tbl=(T)=>`<div class="scroll"><table class="tbl"><thead><tr><th>Airline</th><th class="r">Flights a week</th><th class="r">Routes added</th><th class="r">Routes dropped</th></tr></thead><tbody>${T.map(x=>`<tr><td>${alTag(x.i)}</td><td class="r ${x.net>0?"ok":"bad"}">${sg(x.net)}</td><td class="r">${fmtN(x.ra)}</td><td class="r">${fmtN(x.rr)}</td></tr>`).join("")}</tbody></table></div>`;
  out.innerHTML=`<p class="status">Between <b>${f(C.from)}</b> and <b>${f(C.to)}</b></p>
  <div class="stats">${stat("Biggest grower",up.length?esc(AL[up[0].i].name):"—",up.length?`${sg(up[0].net)} flights a week`:"",true)}${stat("Routes added",fmtN(C.add.length),"across Echo")}${stat("Routes dropped",fmtN(C.rem.length),"")}${stat("New to Echo",fmtN(C.joined.length),"airlines")}</div>

/* ---------- plane finder ---------- */
let REGIDX=null;const regIdx=()=>{if(REGIDX)return REGIDX;REGIDX=new Map();ACL.forEach((a,i)=>{if(!a||!a[1])return;const k=String(a[1]).toUpperCase();if(!REGIDX.has(k))REGIDX.set(k,[]);REGIDX.get(k).push(i);});return REGIDX;};
function viewPlane(){const q=Q();$("main").innerHTML=head("Plane","finder","Type a registration to see that plane's whole week: every flight, where it spends each night and how many hours it flies.")+
  `<form class="f" id="f"><label>Registration<input id="rg" autocomplete="off" spellcheck="false" value="${esc(q.get("reg")||"")}" placeholder="N123SR"></label><button class="btn prim">Find</button></form><div class="out" id="out"></div>`;
  $("f").onsubmit=e=>{e.preventDefault();runPlane();};if(q.get("reg"))runPlane(q.get("ac")!=null?+q.get("ac"):undefined);}
function runPlane(pickAc){const out=$("out"),v=$("rg").value.trim().toUpperCase().replace(/\s+/g,"");if(!v){out.innerHTML=`<p class="err">Type a registration.</p>`;return;}
  const I=regIdx();let acs=I.get(v)||I.get(v.replace(/^([A-Z0-9]{1,2})([A-Z0-9]{3,})$/,"$1-$2"))||[];
  if(pickAc!=null&&ACL[pickAc])acs=[pickAc];
  if(!acs.length){const near=[...I.keys()].filter(k=>k.replace(/-/g,"").startsWith(v.replace(/-/g,""))).slice(0,24);
    out.innerHTML=near.length?`<p class="note">No plane is registered exactly ${esc(v)}. Did you mean:</p><div class="chips">${near.map(k=>`<a class="chip" style="text-decoration:none;color:inherit" href="#/plane?reg=${encodeURIComponent(k)}">${esc(k)}</a>`).join("")}</div>`:`<p class="err">No Echo plane has a registration like ${esc(v)}.</p>`;return;}
  const rows=ROT.filter(r=>acs.includes(r.ac)),owners=[...new Set(rows.map(r=>r.ai))];

  const ac=acs[0],me=rows.length?rows[0].ai:null;$("rg").value=ACL[ac][1];setQ("plane",{reg:ACL[ac][1],ac:acs.length>1?ac:""});

/* ---------- route builder ---------- */
function viewRouteBuild(){const q=Q();$("main").innerHTML=head("Route","builder","Get from one airport to another on Echo flights in as few hops as possible, with who flies each leg. Keep it inside one division if you like.")+
  `<form class="f" id="f">${apIn("a","From",q.get("from"))}${apIn("b","To",q.get("to"))}<label>Airlines<select id="sc"><option value="">All of Echo</option>${DIVS.map(d=>`<option value="${d.code}"${q.get("dv")===d.code?" selected":""}>${esc(d.name)}</option>`).join("")}</select></label><button class="btn prim">Build</button></form><div class="out" id="out"></div>`;
  apList();$("f").onsubmit=e=>{e.preventDefault();runRouteBuild();};if(q.get("from")&&q.get("to"))runRouteBuild();}
function adjacency(dvc){const A=new Map(),P=pairIndex();for(const [k,m] of P){const ok=[...m].filter(([i])=>!dvc||divOf(i).code===dvc);if(!ok.length)continue;const [x,y]=k.split("|");
  for(const [p,q] of [[x,y],[y,x]]){if(!A.has(p))A.set(p,new Map());A.get(p).set(q,ok);}}return A;}
function runRouteBuild(){const a=apPick($("a").value),b=apPick($("b").value),out=$("out"),dvc=$("sc").value;
  if(!a||!b){out.innerHTML=`<p class="err">Both need to be airports Echo flies to.</p>`;return;}if(a===b){out.innerHTML=`<p class="err">Pick two different airports.</p>`;return;}
  $("a").value=a;$("b").value=b;setQ("routebuild",{from:a,to:b,dv:dvc});
  const A=adjacency(dvc);if(!A.has(a)||!A.has(b)){out.innerHTML=`<p class="err">${!A.has(a)?a:b} has no ${dvc?esc(DIVS.find(d=>d.code===dvc).name)+" ":""}flights.</p>`;return;}
  /* breadth first: how many hops to everywhere, then every shortest path back from B */
  const dist0=new Map([[a,0]]),qq=[a];while(qq.length){const x=qq.shift();if(x===b)break;const d=dist0.get(x);if(d>=5)continue;for(const y of A.get(x).keys())if(!dist0.has(y)){dist0.set(y,d+1);qq.push(y);}}
  if(!dist0.has(b)){out.innerHTML=`<p class="err">There's no way from ${a} to ${b} on ${dvc?"that division's":"Echo"} flights within five hops.</p>`;return;}
  const H=dist0.get(b),paths=[];const walk=(x,path)=>{if(paths.length>=400)return;if(x===a){paths.push([a,...path].reverse().reverse());return;}
    for(const [y] of A.get(x)){if(dist0.get(y)===dist0.get(x)-1)walk(y,[x,...path]);}};
  walk(b,[]);const P=paths.map(p=>p[0]===a?p:[a,...p]).map(p=>{const legs=[];for(let i=0;i<p.length-1;i++)legs.push({x:p[i],y:p[i+1],who:A.get(p[i]).get(p[i+1])});
    return {p,legs,km:legs.reduce((s,l)=>s+km(l.x,l.y),0),min:Math.min(...legs.map(l=>l.who.reduce((s,w)=>s+w[1],0)))};}).sort((p,q)=>p.km-q.km).slice(0,6);
  out.innerHTML=`<div class="stats">${stat("Fewest hops",fmtN(H),H===1?"nonstop":`${H-1} stop${H>2?"s":""}`,true)}${stat("Shortest way",dist(P[0].km),`straight line ${dist(km(a,b))}`)}${stat("Ways with "+H+" hop"+(H>1?"s":""),fmtN(paths.length>=400?400:paths.length)+(paths.length>=400?"+":""),"")}</div>
  ${P.map((x,n)=>`<div class="rb"><p class="rbh"><b>${x.p.join(" → ")}</b> <span>${dist(x.km)}</span></p>${x.legs.map(l=>`<p class="rbl">${l.x}–${l.y} <span class="sub" style="display:inline">${dist(km(l.x,l.y))}</span> · ${l.who.sort((p,q)=>q[1]-p[1]).slice(0,3).map(([i,f])=>`${esc(AL[i].name)} (${fmtN(f)} a week)`).join(", ")}${l.who.length>3?` and ${l.who.length-3} more`:""}</p>`).join("")}</div>`).join("")}
  <p class="note">Hops only, not timed connections: check the times with Connections. The shortest ways by distance are shown first.</p>`;}

/* ---------- Elysium: frequency spread ---------- */
const SPREAD={2:[0,3],3:[0,2,4],4:[0,1,3,5],5:[0,1,2,4,5]};
function viewSpread(){const q=Q();$("main").innerHTML=head("Frequency","spread","Routes flown two to five times a week on bunched-up days. Real airlines spread them out: Monday, Wednesday, Friday rather than Monday, Tuesday, Wednesday.")+
  `<form class="f" id="f">${elyAl(q)}<button class="btn prim">Check</button></form><div class="out" id="out"></div>`;alList();$("f").onsubmit=e=>{e.preventDefault();runSpread();};runSpread(q.get("al")!=null?+q.get("al"):undefined);}
function runSpread(pick){const out=$("out"),P=elyPick(out,pick,i=>runSpread(i));if(!P)return;setQ("spread",P.all?{}:{al:P.me});
  const S=new Set(P.list),bad=[];let n=0;
  for(const r of ROT){if(!S.has(r.ai))continue;const c=pc(r.dm);if(c<2||c>5)continue;n++;const D=[0,1,2,3,4,5,6].filter(i=>(r.dm>>i)&1);
    const gaps=D.map((d,i)=>mod(D[(i+1)%D.length]-d,7)||7),mx=Math.max(...gaps),ideal=Math.ceil(7/c);if(mx-ideal<2)continue;
    const T=SPREAD[c],sug=T.map(x=>(x+D[0])%7).sort((p,q)=>p-q);bad.push({r,D,sug,mx});}
  bad.sort((p,q)=>q.mx-p.mx);const days=a=>a.map(i=>DAYN[i]).join(" ");
  out.innerHTML=`<div class="stats">${stat("Spread well",n?Math.round((n-bad.length)/n*100)+"%":"—",`of ${fmtN(n)} routes flown 2 to 5 times a week`,true)}${stat("Bunched up",fmtN(bad.length),"routes")}${stat("Checked",P.all?"Elysium":esc(AL[P.me].name),"")}</div>
  ${bad.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Flight</th>${P.all?"<th>Airline</th>":""}<th>Flies</th><th>Longest gap</th><th>Spread out</th></tr></thead><tbody>${bad.slice(0,80).map(x=>`<tr><td><b>${esc(fnOf(x.r.ai,x.r.fn))}</b> ${x.r.A}–${x.r.B}</td>${P.all?`<td>${esc(AL[x.r.ai].name)}</td>`:""}<td>${days(x.D)}</td><td class="bad">${x.mx} days</td><td>${days(x.sug)}</td></tr>`).join("")}</tbody></table></div>${bad.length>80?`<p class="note">The 80 most bunched of ${fmtN(bad.length)}.</p>`:""}`:`<p class="note">Every route flown a few times a week is nicely spread.</p>`}
  <p class="note">Days are local at the departure airport. "Spread out" keeps your first day and spaces the rest evenly; moving days changes that plane's week, so check it with the Turnaround check.</p>`;}

/* ---------- Elysium: same flight, same plane ---------- */
function viewEquip(){const q=Q();$("main").innerHTML=head("Same flight,","same plane","Flight numbers flown by different aircraft types on different days. Real airlines keep a flight on one type so the seats people book stay the same.")+

function runEquip(pick){const out=$("out"),P=elyPick(out,pick,i=>runEquip(i));if(!P)return;setQ("equip",P.all?{}:{al:P.me});

/* ---------- Elysium: network shape ---------- */
function shapeOf(ai){const dep=new Map();let tot=0;const legs=[];for(const r of ROT){if(r.ai!==ai)continue;for(const [f,t,n] of rowLegs(r)){dep.set(f,(dep.get(f)||0)+n);tot+=n;legs.push([f,t,n]);}}

  return {share:viaHub/tot,hubs:[...hubs],p2p,tot};}

function runShape(pick){const out=$("out"),me=alResolve(out,$("al"),pick,i=>runShape(i));if(me==null)return;$("al").value=AL[me].name;setQ("shape",{al:me});

/* ---------- game: connect the dots ---------- */
const DT={A:null,B:null,at:null,hops:[],par:0,adj:null,solved:0};
function viewDots(){$("main").innerHTML=gameHead("Connect","the dots","Get from one airport to the other on real Echo flights. Every hop must be a route an Echo airline flies. Can you match the fewest hops?")+`<div class="out" id="out"></div>`;dtNew();}
function dtNew(){if(!DT.adj)DT.adj=adjacency("");const top=apBusy().slice(0,250).map(x=>x[0]).filter(c=>DT.adj.has(c));let t=0;
  do{DT.A=pickR(top);DT.B=pickR(top);const d=new Map([[DT.A,0]]),q=[DT.A];while(q.length){const x=q.shift();if(x===DT.B)break;for(const y of DT.adj.get(x).keys())if(!d.has(y)){d.set(y,d.get(x)+1);q.push(y);}}DT.par=d.get(DT.B)||0;t++;}
  while((DT.par<2||DT.par>3)&&t<60);DT.at=DT.A;DT.hops=[DT.A];dtDraw();}
function dtDraw(msg){const out=$("out");if(!out)return;const nb=[...DT.adj.get(DT.at).keys()].filter(c=>AP[c]).sort();const done=DT.at===DT.B;
  out.innerHTML=`<div class="stats">${stat("From",DT.A,esc(cityOf(DT.A)),true)}${stat("To",DT.B,esc(cityOf(DT.B)))}${stat("Hops",fmtN(DT.hops.length-1),`best is ${DT.par}`)}${stat("Solved in the fewest",fmtN(DT.solved),`best ${fmtN(best.get("dots"))}`)}</div>
  <div class="codebox"><p class="trail">${DT.hops.map((c,i)=>`<b>${c}</b>`).join(" → ")}</p>
  ${done?`<p class="qres ${DT.hops.length-1<=DT.par?"ok":"bad"}">${DT.hops.length-1<=DT.par?`Made it in ${DT.par}, the fewest possible.`:`Made it in ${DT.hops.length-1}. It can be done in ${DT.par}.`}</p><button type="button" class="btn prim" id="nx">New puzzle</button>`:
  DT.hops.length>8?`<p class="qres bad">Out of fuel after 8 hops. It can be done in ${DT.par}.</p><button type="button" class="btn prim" id="nx">New puzzle</button>`:
  `<p class="note">You're at <b>${DT.at}</b> ${esc(cityOf(DT.at))}, ${dist(km(DT.at,DT.B))} from ${DT.B}. Echo flies from here to ${fmtN(nb.length)} airports.</p>
  <div class="f dotsf"><label>Fly to<input id="nx2" list="dotsnb" autocomplete="off" spellcheck="false" placeholder="three-letter code"></label><button type="button" class="btn prim" id="fly">Fly</button>${DT.hops.length>1?`<button type="button" class="btn" id="undo">Back one</button>`:""}</div>
  <datalist id="dotsnb">${nb.map(c=>`<option value="${c}">${esc(cityOf(c))}, ${esc(country(AP[c].cc))}</option>`).join("")}</datalist>${msg?`<p class="err">${msg}</p>`:""}`}</div>`;
  if($("nx"))$("nx").onclick=dtNew;
  if($("fly")){const go=()=>{const c=apPick($("nx2").value)||$("nx2").value.trim().toUpperCase();if(!DT.adj.get(DT.at).has(c))return dtDraw(`No Echo airline flies ${esc(DT.at)}–${esc(c||"?")}.`);
    DT.at=c;DT.hops.push(c);if(c===DT.B&&DT.hops.length-1<=DT.par){DT.solved++;best.set("dots",DT.solved);}dtDraw();};$("fly").onclick=go;$("nx2").onkeydown=e=>{if(e.key==="Enter")go();};$("nx2").focus();}

function viewDayBuild(){

  alList();apList();const fillTypes=()=>{const m=alFind($("al").value);const me=m.length===1?m[0]:null,F=typeFar(),mine=new Map();
    if(me!=null)for(const r of ROT)if(r.ai===me&&r.ac>=0&&ACL[r.ac])mine.set(ACL[r.ac][0],(mine.get(ACL[r.ac][0])||0)+1);
    const own=[...mine].sort((p,q)=>q[1]-p[1]).map(x=>x[0]).filter(t=>F.has(t)),rest=[...F.keys()].filter(t=>!mine.has(t)).sort((a,b)=>MODELS[a].localeCompare(MODELS[b]));const want=q.get("ty");

  $("f").onsubmit=e=>{e.preventDefault();runDayBuild();};if(q.get("al")!=null||q.get("q"))runDayBuild(q.get("al")!=null?+q.get("al"):undefined);}
function runDayBuild(pick){
  const out=$("out"),me=alResolve(out,$("al"),pick,i=>runDayBuild(i));if(me==null)return;$("al").value=AL[me].name;
  const dep=new Map();for(const r of ROT)if(r.ai===me)for(const [f,,n] of rowLegs(r))dep.set(f,(dep.get(f)||0)+n);
  if(!dep.size)return noRoutes(out,me);
  const h=$("a").value.trim()?apPick($("a").value):[...dep].sort((p,q)=>q[1]-p[1])[0][0];if(!h){out.innerHTML=`<p class="err">That isn't an airport Echo flies to.</p>`;return;}$("a").value=h;
  if(!$("ty").value){const ev=new Event("change");$("al").dispatchEvent(ev);}
  const t=+$("ty").value,F=typeFar().get(t);if(!F){out.innerHTML=`<p class="err">Pick an aircraft.</p>`;return;}
  const [sh,sm]=$("st").value.split(":").map(Number),st=(sh||0)*60+(sm||0),DL=+$("dl").value,sd=$("sd").checked;
  setQ("daybuild",{al:me,ap:h,ty:t,st:$("st").value,dl:DL,sd:sd?1:0});
  const R=F.p95,mine=alPairs(me),P=pairIndex(),W=apWeek(),dv=divOf(me),turn=minTurn(MODELS[t]);
  const blk=(x,y)=>Math.round(pairDur(x,y)||estBlock(x,y));
  /* every possible out-and-back from the hub, with its value per hour of the plane's time */
  const C=[];for(const [c,w] of W){if(c===h||!AP[c]||w<30)continue;const k=km(h,c);if(k>R||k<150||!legalPair(h,c))continue;
    /* a long-range plane goes on long routes: nothing under a quarter of its range (same rule as Right-size) */
    if(R>=7000&&k<R*0.25)continue;const key=pairKey(h,c);if(mine.has(key))continue;
    const m=P.get(key),tot=m?[...m.values()].reduce((s,x)=>s+x,0):0;if(sd&&m&&[...m.keys()].some(i=>i>=dv.first&&i<dv.first+dv.count))continue;
    const out1=blk(h,c),back=blk(c,h),trip=out1+groundMin(h,c)+back+turn,demand=Math.log1p(tot*3+Math.sqrt(w)),value=demand*Math.pow(k,0.8);
    C.push({c,k,tot,airlines:m?m.size:0,out1,back,trip,value,vph:value/(trip/60)});}
  if(!C.length){out.innerHTML=`<p class="note">No route from ${h} fits a ${esc(MODELS[t])} that ${esc(AL[me].name)} doesn't already fly.</p>`;return;}
  C.sort((p,q)=>q.vph-p.vph);
  /* fill the day: best value per hour that still fits, then keep going with what's left */
  const day=[];let left=DL,used=new Set();

  if(!day.length){out.innerHTML=`<p class="note">No unflown route from ${h} fits in ${dur(DL)} with a ${esc(MODELS[t])}.</p>`;return;}
  let clock=st;const rows=day.map(x=>{const d1=clock,a1=d1+x.out1,d2=a1+groundMin(h,x.c),a2=d2+x.back;clock=a2+turn;return {x,d1,a1,d2,a2};});
  const blockH=day.reduce((s,x)=>s+x.out1+x.back,0),hm2=m=>hhmm(mod(m,1440))+(m>=1440?`<sup>+1</sup>`:"");
  const alt=C.filter(z=>!used.has(z.c)).slice(0,12);
  out.innerHTML=`<div class="stats">${stat("Rotations",fmtN(day.length),`from ${esc(apName(h))}`,true)}${stat("Flying",dur(blockH),`of a ${dur(DL)} day`)}${stat("Day used",Math.round((DL-left)/DL*100)+"%","including ground time")}${stat("Plane",esc(MODELS[t]),`good for ${dist(R)}`)}</div>
  <div class="scroll"><table class="tbl"><thead><tr><th>Route</th><th class="r">Leaves ${h}</th><th class="r">Lands</th><th class="r">Leaves back</th><th class="r">Home</th><th>Why it's worth it</th><th></th></tr></thead><tbody>
  ${rows.map(({x,d1,a1,d2,a2})=>`<tr><td><b>${h}–${x.c}</b><span class="sub">${esc(cityOf(x.c))}, ${esc(country(AP[x.c].cc))} · ${dist(x.k)}</span></td><td class="r">${hm2(d1)}</td><td class="r">${hm2(a1)}</td><td class="r">${hm2(d2)}</td><td class="r">${hm2(a2)}</td><td>${x.tot?`${fmtN(x.airlines)} Echo airline${x.airlines>1?"s":""}, ${fmtN(x.tot)} flights a week prove the demand`:`nobody flies it yet; ${cityOf(x.c)} has ${fmtN(W.get(x.c))} Echo departures a week`}</td><td><a class="btn sm" href="#/route?from=${h}&to=${x.c}">Check</a></td></tr>`).join("")}</tbody></table></div>
  ${alt.length?`<h4>Next best, if one of those doesn't suit</h4><div class="chips">${alt.map(z=>`<a class="chip" style="text-decoration:none;color:inherit" href="#/route?from=${h}&to=${z.c}">${h}–${z.c} · ${dist(z.k)} · ${z.tot?fmtN(z.tot)+" a week on Echo":"new"}</a>`).join("")}</div>`:""}
  <p class="note">Times are on the hub's clock (the hub is ${h}, so landing times abroad are hub time too: check local times in Rotation planner). Block times are what Echo airlines actually fly where they exist, otherwise estimated; ground time abroad follows the game's distance rule and ${dur(turn)} is allowed at ${h} between rotations. "Value" leans on routes other Echo airlines already prove busy, and on longer routes, measured per hour of the plane's day. Long-range planes only get routes of at least a quarter of their range.</p>`;}

  `<form class="f" id="f">${alIn("al","Airline",alVal(q))}${apIn("a","Hub <small>optional</small>",q.get("ap"))}<label>Connection<select id="mc">${[[45,"45 min to 3 h"],[60,"1 h to 4 h"],[90,"1 h 30 to 5 h"]].map(([v,t])=>`<option value="${v}"${String(v)===(q.get("mc")||"60")?" selected":""}>${t}</option>`).join("")}</select></label><button class="btn prim">Build banks</button></form><div class="out" id="out"></div>`;
  alList();apList();$("f").onsubmit=e=>{e.preventDefault();runBanks();};if(q.get("al")!=null||q.get("q"))runBanks(q.get("al")!=null?+q.get("al"):undefined);}
function runBanks(pick){const out=$("out"),me=alResolve(out,$("al"),pick,i=>runBanks(i));if(me==null)return;$("al").value=AL[me].name;
  const mine=ROT.filter(r=>r.ai===me);if(!mine.length)return noRoutes(out,me);
  const dep=new Map();for(const r of mine)for(const [f,,n] of rowLegs(r))dep.set(f,(dep.get(f)||0)+n);
  const h=$("a").value.trim()?apPick($("a").value):[...dep].sort((p,q)=>q[1]-p[1])[0][0];if(!h||!dep.has(h)){out.innerHTML=`<p class="err">${esc(AL[me].name)} doesn't fly from there.</p>`;return;}$("a").value=h;

/* ---------- Elysium: schedule report card ---------- */

  `<form class="f" id="f">${alIn("al","Airline",alVal(q))}<button class="btn prim">Grade it</button></form><div class="out" id="out"></div>`;alList();$("f").onsubmit=e=>{e.preventDefault();runReport();};if(q.get("al")!=null||q.get("q"))runReport(q.get("al")!=null?+q.get("al"):undefined);}

  G.push({k:"Passenger-friendly times",tool:"hours",g:GRADE(sp),txt:`${Math.round(sp)}% of flights leave and land between 5 AM and 1 AM`});
  /* registrations */

  if(acs.length&&REGP[cc]){const ok=acs.filter(ac=>regFits(ACL[ac][1],cc)).length,p=ok/acs.length*100;G.push({k:"Registrations",tool:"regs",g:GRADE(p),txt:`${Math.round(p)}% of planes carry ${esc(country(cc))}'s letters`});}

    G.push({k:"Frequency spread",tool:"spread",g:GRADE(p),txt:`${Math.round(p)}% of part-week routes are evenly spread`});}
  /* one type per flight */

  if(M.size){const p=[...M.values()].filter(s=>s.size===1).length/M.size*100;G.push({k:"Same flight, same plane",tool:"equip",g:GRADE(p),txt:`${Math.round(p)}% of flight numbers stay on one type`});}
  const gpa=G.reduce((s,x)=>s+GPA[x.g],0)/G.length,overall=gpa>=3.5?"A":gpa>=2.75?"B":gpa>=2?"C":gpa>=1.25?"D":"F";
  G.sort((p,q)=>GPA[p.g]-GPA[q.g]);
  out.innerHTML=`<div class="report"><div class="grade g${overall}"><span>${overall}</span><small>overall</small></div><div><b>${esc(AL[me].name)}</b><p class="note" style="margin:4px 0 0">${G.filter(x=>GPA[x.g]<=1).length?`Start with ${G.filter(x=>GPA[x.g]<=1).map(x=>x.k.toLowerCase()).join(" and ")}.`:"A realistic schedule. Nice work."}</p></div></div>
  <div class="cards">${G.map(x=>`<a class="rc" href="#/${x.tool}?al=${me}"><span class="grade sm g${x.g}"><span>${x.g}</span></span><span><b>${x.k}</b><small>${x.txt}</small></span></a>`).join("")}</div>
  <p class="note">A 95%+, B 85%+, C 70%+, D 50%+. Curfews are graded on the count: none is an A. Turnarounds are strict on purpose: the game lets a plane start its next route 5 minutes after landing, which no real airline can do, so most airlines score low there. Click any card for the full check.</p>`;}

/* ---------- who can use it: Resonants of the Echo United Alliances Discord ----------
   People sign in with Discord (through Echo Live's Supabase). Right after signing in, the page hands
   the Discord token to the airtools-gate function once, which asks Discord whether that account has
   the Resonants role in the EUA server and records the answer; later visits ask echo_tools_ok(),
   and after 7 days it asks them to sign in again so a removed role stops working. */
/* switched off for now (7 Nov): set GATE_ON to true to bring the Resonants sign-in back. It also needs
   AIRTOOLS_GUILD_ID / AIRTOOLS_ROLE_ID set on the airtools-gate function, and this site's address in
   Supabase → Authentication → URL Configuration → Redirect URLs. */
const GATE_ON=false;
let SB=null;const GATE_FN=SB_URL+"/functions/v1/airtools-gate";
function sbClient(){if(SB)return SB;if(!window.supabase)throw new Error("the sign-in library didn't load");
  SB=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:"pkce",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"echo_airtools_auth"}});return SB;}
const store={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}},
  sget:k=>{try{return sessionStorage.getItem(k);}catch(_){return null;}},sset:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v);}catch(_){}}};
const userName=u=>{const m=(u&&u.user_metadata)||{};return m.custom_claims&&m.custom_claims.global_name||m.full_name||m.name||m.user_name||"you";};
async function gate(){
  if(!window.supabase)await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
  const c=sbClient(),{data:{session}}=await c.auth.getSession();
  if(!session)return {ok:false,why:"none"};
  const u=session.user,disc=(u.identities||[]).some(i=>i.provider==="discord");
  if(!disc)return {ok:false,why:"not_discord",u};
  /* just signed in: check the role with Discord (once per Discord token) */
  const pt=session.provider_token,mark=pt?pt.slice(-10):"";
  if(pt&&store.get("echo_tb_checked")!==mark){
    const r=await fetch(GATE_FN,{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({provider_token:pt})})
      .then(x=>x.json()).catch(()=>({ok:false,why:"unreachable"}));
    if(r&&r.why!=="unreachable"&&r.why!=="busy")store.set("echo_tb_checked",mark);
    return {ok:!!(r&&r.ok),why:r&&r.why,u};}
  const {data,error}=await c.rpc("echo_tools_ok");
  if(error)return {ok:false,why:"unreachable",u};
  return {ok:!!(data&&data.ok),why:data&&data.why,u};}
async function signIn(again){
  const c=sbClient();store.sset("echo_tb_back",location.hash&&location.hash!=="#/"?location.hash:null);
  if(again){try{await c.auth.signOut({scope:"local"});}catch(_){}}
  const {error}=await c.auth.signInWithOAuth({provider:"discord",options:{redirectTo:location.origin+location.pathname,scopes:"identify guilds.members.read"}});
  if(error&&$("gmsg"))$("gmsg").textContent="Discord sign-in didn't start: "+error.message;}
async function signOut(){try{await sbClient().auth.signOut({scope:"local"});}catch(_){}location.replace(location.pathname);}
const GATE_WHY={none:"",unchecked:"",
  no_role:"You're in the Echo United Alliances Discord, but you don't have the Resonants role yet.",
